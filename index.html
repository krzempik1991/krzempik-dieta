<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2d6a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KrzempiK Dieta">
<title>KrzempiK — Moja Dieta</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2ed;
  --surface: #ffffff;
  --surface2: #f0ede8;
  --border: #e2ddd6;
  --text: #1a1714;
  --text2: #6b6560;
  --text3: #a09890;
  --green: #2d6a4f;
  --green-light: #e8f4ee;
  --green-mid: #b7dfc8;
  --amber: #92400e;
  --amber-light: #fef3c7;
  --rose: #9f1239;
  --rose-light: #fce7f3;
  --accent: #2d6a4f;
  --radius: 12px;
  --radius-lg: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  display: flex;
  align-items: center;
  gap: 2rem;
  position: sticky;
  top: 0;
  z-index: 50;
}
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 24px;
  color: var(--green);
  padding: 1rem 0;
  white-space: nowrap;
}
.logo span { color: var(--text3); font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 300; margin-left: 8px; }
.nav { display: flex; gap: 0; flex: 1; }
.nav-btn {
  padding: 1.2rem 1.5rem;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  color: var(--text2);
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
}
.nav-btn:hover { color: var(--text); }
.nav-btn.active { color: var(--green); border-bottom-color: var(--green); }
.header-stats {
  margin-left: auto;
  display: flex;
  gap: 1.5rem;
  align-items: center;
}
.hstat { text-align: right; }
.hstat-val { font-size: 18px; font-weight: 600; color: var(--green); }
.hstat-lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.04em; }

/* LAYOUT */
.main { max-width: 1400px; margin: 0 auto; padding: 2rem; }
.section { display: none; }
.section.active { display: block; }

/* SCALER BAR */
.scaler-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 2rem;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.scaler-bar label { font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--text2); }
.scaler-bar input[type=range] { flex: 1; min-width: 120px; max-width: 320px; cursor: pointer; }
.scaler-val { font-size: 15px; font-weight: 600; color: var(--green); min-width: 70px; }
.scaler-factor {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--green-light);
  color: var(--green);
  font-weight: 600;
  white-space: nowrap;
}
.scaler-factor.over { background: #fef3c7; color: #92400e; }
.scaler-reset {
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  font-size: 12px;
  cursor: pointer;
  color: var(--text2);
  font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
}
.scaler-reset:hover { background: var(--surface2); }
.scaler-info { font-size: 12px; color: var(--text3); white-space: nowrap; }
@media (max-width: 600px) {
  .scaler-bar { padding: 10px 1rem; gap: 10px; }
  .scaler-bar input[type=range] { max-width: none; }
  .scaler-info { display: none; }
}

/* SEARCH BAR */
.search-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
.search-bar input, .search-bar select {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.search-bar input { flex: 1; min-width: 200px; }
.search-bar input:focus, .search-bar select:focus { border-color: var(--green); }
.search-bar select { cursor: pointer; }

/* MEAL GRID */
.meal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 16px;
}
.meal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.meal-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  border-color: var(--green-mid);
}
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  margin-bottom: 10px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.badge-s { background: var(--amber-light); color: var(--amber); }
.badge-d { background: var(--green-light); color: var(--green); }
.badge-k { background: var(--rose-light); color: var(--rose); }
.meal-name {
  font-family: 'DM Serif Display', serif;
  font-size: 16px;
  line-height: 1.3;
  margin-bottom: 12px;
  color: var(--text);
}
.macros {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.macro {
  font-size: 12px;
  padding: 4px 10px;
  background: var(--surface2);
  border-radius: 999px;
  color: var(--text2);
}
.macro strong { color: var(--text); font-weight: 600; }

/* MODAL */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26,23,20,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  backdrop-filter: blur(4px);
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  padding: 2rem;
  max-width: 620px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  position: relative;
}
.modal-close {
  position: absolute;
  top: 1.25rem;
  right: 1.25rem;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface2);
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text2);
  transition: background 0.15s;
}
.modal-close:hover { background: var(--border); }
.modal h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  margin: 10px 0 1rem;
  padding-right: 2rem;
  line-height: 1.3;
}
.section-lbl {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text3);
  margin: 1.25rem 0 0.5rem;
}
.ing-list { padding-left: 1.5rem; }
.ing-list li {
  font-size: 13.5px;
  color: var(--text2);
  margin-bottom: 4px;
  line-height: 1.5;
}
.steps-list { list-style: none; counter-reset: steps; }
.steps-list li {
  counter-increment: steps;
  padding: 10px 0 10px 2.75rem;
  position: relative;
  font-size: 13.5px;
  line-height: 1.6;
  border-bottom: 1px solid var(--border);
  color: var(--text2);
}
.steps-list li:last-child { border-bottom: none; }
.steps-list li::before {
  content: counter(steps);
  position: absolute;
  left: 0;
  top: 10px;
  width: 24px;
  height: 24px;
  background: var(--green-light);
  color: var(--green);
  border-radius: 50%;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.add-row {
  margin-top: 1.5rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.add-row label { font-size: 13px; font-weight: 500; white-space: nowrap; }
.add-row select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
.btn {
  padding: 9px 18px;
  border-radius: var(--radius);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface2); }
.btn-primary {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.btn-primary:hover { background: #235c42; border-color: #235c42; }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-danger { color: var(--rose); border-color: #fecdd3; }
.btn-danger:hover { background: var(--rose-light); }

/* PLANNER */
.planner-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 12px;
}
.planner-header h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
}
.week-stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 1.5rem;
}
.wstat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  text-align: center;
}
.wstat-val { font-size: 22px; font-weight: 600; color: var(--green); }
.wstat-lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
.planner-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}
.plan-day {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  min-height: 180px;
}
.plan-day-lbl {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text3);
  text-align: center;
  margin-bottom: 8px;
}
.plan-slot {
  min-height: 50px;
  border-radius: 8px;
  margin-bottom: 6px;
  padding: 6px 8px;
  position: relative;
  font-size: 10px;
  transition: border-color 0.15s;
}
.plan-slot.empty {
  border: 1.5px dashed var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text3);
  cursor: pointer;
  line-height: 1.3;
}
.plan-slot.empty:hover { border-color: var(--green-mid); color: var(--green); background: var(--green-light); }
.plan-slot.filled {
  border: 1px solid var(--border);
  background: var(--surface2);
  cursor: default;
}
.slot-type { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin-bottom: 2px; }
.slot-name { font-size: 10px; font-weight: 500; line-height: 1.3; color: var(--text); }
.slot-kcal { font-size: 9px; color: var(--text3); margin-top: 2px; }
.slot-rm {
  position: absolute;
  top: 3px;
  right: 4px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fecdd3;
  color: var(--rose);
  border: none;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  opacity: 0;
  transition: opacity 0.15s;
}
.plan-slot.filled:hover .slot-rm { opacity: 1; }
.day-total {
  font-size: 10px;
  text-align: center;
  color: var(--green);
  font-weight: 600;
  margin-top: 4px;
}
.day-copy-btn {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding: 5px 0;
  font-size: 10px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  color: var(--text3);
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  text-align: center;
  line-height: 1.4;
}
.day-copy-btn:hover { color: var(--green); border-color: var(--green-mid); background: var(--green-light); }

/* SHOPPING */
.shop-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 12px;
}
.shop-header h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
}
.shop-layout {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.shop-cat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
}
.shop-cat-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.shop-cat-icon { font-size: 16px; }
.shop-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.shop-item:last-child { border-bottom: none; }
.shop-item input[type="checkbox"] { margin-top: 3px; cursor: pointer; accent-color: var(--green); width: 15px; height: 15px; flex-shrink: 0; }
.shop-item span { line-height: 1.4; }
.shop-item.done span { text-decoration: line-through; color: var(--text3); }
.shop-amt { font-size: 11px; color: var(--text3); display: block; }
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text3);
  font-size: 15px;
}
.empty-state .big { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--text2); margin-bottom: 0.5rem; }

/* MODAL SELECT */
.meal-select-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  max-height: 340px;
  overflow-y: auto;
  margin-top: 1rem;
}
.meal-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  gap: 12px;
}
.meal-option:hover { background: var(--green-light); border-color: var(--green-mid); }
.meal-option .mname { font-size: 13.5px; font-weight: 500; line-height: 1.3; }
.meal-option .mkcal { font-size: 12px; color: var(--text3); white-space: nowrap; }
.search-mini {
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  width: 100%;
  outline: none;
  background: var(--surface);
  color: var(--text);
  margin-bottom: 4px;
}
.search-mini:focus { border-color: var(--green); }

/* RESPONSIVE — TABLET */
@media (max-width: 900px) {
  .planner-grid { grid-template-columns: repeat(4, 1fr); }
  .week-stats { grid-template-columns: repeat(3, 1fr); }
  .meal-grid { grid-template-columns: repeat(2, 1fr); }
}

/* RESPONSIVE — MOBILE */
@media (max-width: 600px) {

  /* ── HEADER ── */
  .header {
    padding: 0 1rem;
    gap: 0;
    justify-content: space-between;
    height: 52px;
    flex-wrap: nowrap;
  }
  .logo { font-size: 20px; padding: 0; flex-shrink: 0; }
  .logo span { display: none; }
  .header-stats { display: none; }

  /* ── BOTTOM NAV ── */
  .nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: stretch;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-btn {
    flex: 1;
    padding: 8px 4px 10px;
    font-size: 11px;
    font-weight: 500;
    border-bottom: none;
    border-top: 2px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    line-height: 1.2;
  }
  .nav-btn.active { border-top-color: var(--green); color: var(--green); }
  .nav-btn::before { font-size: 20px; line-height: 1; display: block; }
  .nav-btn:nth-child(1)::before { content: "🍽"; }
  .nav-btn:nth-child(2)::before { content: "📅"; }
  .nav-btn:nth-child(3)::before { content: "🛒"; }

  /* ── MAIN LAYOUT ── */
  .main {
    padding: 1rem 0.875rem calc(74px + env(safe-area-inset-bottom, 0));
    max-width: 100%;
  }

  /* ── PRZEPISY ── */
  .search-bar { flex-direction: column; gap: 8px; }
  .search-bar input,
  .search-bar select { width: 100%; font-size: 16px; padding: 12px 14px; }
  .meal-grid { grid-template-columns: 1fr; gap: 10px; }
  .meal-card { padding: 1rem; }
  .meal-name { font-size: 15px; }

  /* ── PLANER ── */
  .planner-header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .planner-header h2 { font-size: 20px; }
  .planner-header > div { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .planner-header > div .btn { width: 100%; text-align: center; }
  .week-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 1rem; }
  .wstat { padding: 10px; }
  .wstat-val { font-size: 18px; }
  .wstat-lbl { font-size: 10px; }
  .planner-scroll-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0 -0.875rem;
    padding: 0 0.875rem 1rem;
    scrollbar-width: none;
  }
  .planner-scroll-wrap::-webkit-scrollbar { display: none; }
  .planner-grid {
    grid-template-columns: repeat(7, 130px);
    gap: 8px;
    min-width: max-content;
    width: max-content;
  }
  .plan-day { min-height: 150px; padding: 8px; }
  .plan-day-lbl { font-size: 11px; margin-bottom: 6px; }
  .plan-slot { min-height: 42px; font-size: 9px; }
  .plan-slot.empty { font-size: 9px; }
  .slot-name { font-size: 9px; }
  .slot-kcal { font-size: 8px; }
  .day-total { font-size: 9px; }
  .day-copy-btn { font-size: 9px; padding: 4px 0; margin-top: 4px; }

  /* ── LISTA ZAKUPÓW ── */
  .shop-header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .shop-header h2 { font-size: 20px; }
  .shop-header > div {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .shop-header > div .btn { width: 100%; text-align: center; font-size: 12px; padding: 9px 8px; }
  .shop-layout { grid-template-columns: 1fr; gap: 10px; }
  .shop-cat-card { padding: 1rem; }
  .shop-item { padding: 10px 0; font-size: 14px; }
  .shop-item input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; }
  .shop-amt { font-size: 12px; }

  /* ── MODALS — slide up from bottom ── */
  .modal-backdrop { padding: 0; align-items: flex-end; }
  .modal {
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    max-height: 92vh;
    width: 100%;
    padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom, 0));
  }
  .modal h2 { font-size: 18px; padding-right: 2.5rem; }
  .modal-close { top: 1rem; right: 1rem; }

  /* ── ADD TO PLAN ROW ── */
  .add-row {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .add-row label { font-size: 14px; font-weight: 500; }
  .add-row select {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border-radius: var(--radius);
  }
  .add-row .btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    text-align: center;
  }

  /* ── MODAL WYBORU DANIA ── */
  .meal-select-grid { max-height: 55vh; }
  .meal-option { padding: 14px 12px; }
  .meal-option .mname { font-size: 14px; }
  .meal-option .mkcal { font-size: 12px; }
  .search-mini { font-size: 16px; padding: 13px 14px; }

  /* ── OGÓLNE PRZYCISKI ── */
  .btn { min-height: 44px; }
  .btn-sm { min-height: 40px; }

  /* ── TOAST ── */
  .toast {
    bottom: calc(74px + env(safe-area-inset-bottom, 0) + 8px);
    right: 1rem;
    left: 1rem;
    text-align: center;
  }

  /* ── MAKRO PILLS ── */
  .macro { font-size: 11px; padding: 3px 8px; }

  /* ── SKŁADNIKI I KROKI ── */
  .ing-list li { font-size: 14px; }
  .steps-list li { font-size: 14px; }
  .section-lbl { font-size: 11px; }
  .macros { gap: 5px; }
}
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: var(--green);
  color: #fff;
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  z-index: 999;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body, html { background: #fff !important; }
  .header, .nav, .search-bar, .shop-header .btn,
  .modal-backdrop, .toast { display: none !important; }
  .main { padding: 0 !important; max-width: 100% !important; }
  .section { display: none !important; }
  #sec-shopping { display: block !important; }
  .shop-header { margin-bottom: 1rem !important; }
  .shop-header h2 { font-size: 20px !important; }
  .shop-layout { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px !important; }
  .shop-cat-card { break-inside: avoid; border: 1px solid #ccc !important; border-radius: 6px !important; padding: 10px !important; }
  .shop-cat-title { font-size: 12px !important; font-weight: 700 !important; margin-bottom: 6px !important; padding-bottom: 4px !important; border-bottom: 1px solid #ddd !important; }
  .shop-item { padding: 3px 0 !important; font-size: 12px !important; }
  .shop-item input[type="checkbox"] { display: none !important; }
  .shop-amt { display: inline !important; color: #888 !important; font-size: 10px !important; margin-left: 4px !important; }
  .shop-item::before { content: "☐ "; font-size: 11px; }
  .shop-item.done { text-decoration: none !important; color: #000 !important; }
  .shop-item.done span { text-decoration: none !important; color: #000 !important; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">KrzempiK<span>Moja dieta</span></div>
  <nav class="nav">
    <button class="nav-btn active" onclick="switchTab('meals')">Przepisy</button>
    <button class="nav-btn" onclick="switchTab('planner')">Planer tygodnia</button>
    <button class="nav-btn" onclick="switchTab('shopping')">Lista zakupów</button>
  </nav>
  <div class="header-stats">
    <div class="hstat">
      <div class="hstat-val" id="hs-meals">0</div>
      <div class="hstat-lbl">Posiłków w planie</div>
    </div>
    <div class="hstat">
      <div class="hstat-val" id="hs-kcal">0</div>
      <div class="hstat-lbl">Kcal w tygodniu</div>
    </div>
  </div>
</header>

<!-- SCALER BAR -->
<div class="scaler-bar" id="scaler-bar">
  <label>Kaloryczność dzienna:</label>
  <input type="range" id="sl-kcal" min="1500" max="4500" step="100" value="2300" oninput="onScalerChange()">
  <span class="scaler-val" id="sl-val">2300 kcal</span>
  <span class="scaler-factor" id="sl-factor">bazowo</span>
  <button class="scaler-reset" onclick="resetScaler()">Reset</button>
  <span class="scaler-info" id="sl-info">Baza: ~2300 kcal/dzień</span>
</div>

<main class="main">

  <!-- PRZEPISY -->
  <div class="section active" id="sec-meals">
    <div class="search-bar">
      <input type="text" id="search" placeholder="Szukaj dania..." oninput="renderMeals()">
      <select id="filter-type" onchange="renderMeals()">
        <option value="">Wszystkie posiłki</option>
        <option value="śniadanie">Śniadanie (Posiłek 1)</option>
        <option value="obiad">Obiad (Posiłek 2)</option>
        <option value="kolacja">Kolacja (Posiłek 3)</option>
      </select>
    </div>
    <div class="meal-grid" id="meal-grid"></div>
  </div>

  <!-- PLANER -->
  <div class="section" id="sec-planner">
    <div class="planner-header">
      <h2>Planer tygodnia</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm btn-danger" onclick="clearPlan()">Wyczyść planer</button>
        <button class="btn btn-sm btn-primary" onclick="switchTab('shopping')">Lista zakupów →</button>
      </div>
    </div>
    <div class="week-stats" id="week-stats"></div>
    <div class="planner-scroll-wrap">
      <div class="planner-grid" id="planner-grid"></div>
    </div>
  </div>

  <!-- LISTA ZAKUPÓW -->
  <div class="section" id="sec-shopping">
    <div class="shop-header">
      <h2>Lista zakupów</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="generateShopping()">Odśwież z planera</button>
        <button class="btn btn-sm" onclick="clearChecked()">Odznacz wszystko</button>
        <button class="btn btn-sm" onclick="printFull()">🖨 Drukuj widok</button>
        <button class="btn btn-sm btn-primary" onclick="printSimple()">🖨 Prosta lista</button>
      </div>
    </div>
    <div id="shopping-content"></div>
  </div>

</main>

<!-- MODAL PRZEPIS -->
<div class="modal-backdrop" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-inner"></div>
</div>
